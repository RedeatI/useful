<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://127.0.0.1:*; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Useful 测试源管理台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">0.1.0-beta.1 · INTERNAL TEST ONLY</p>
          <h1>Useful 测试源管理台</h1>
          <p>只连接当前测试源；Token 仅保存在本页内存，不写入浏览器存储。</p>
        </div>
        <span id="health" class="badge">未检查</span>
      </header>

      <section class="card connection">
        <label>
          API 地址
          <input id="base-url" value="http://127.0.0.1:8080" inputmode="url" />
        </label>
        <label>
          Beta 管理 Token
          <input id="token" type="password" autocomplete="off" placeholder="仅用于本次页面会话" />
        </label>
        <button id="check">检查 health / readiness</button>
      </section>

      <nav class="actions" aria-label="管理查询">
        <button data-path="/v1/catalog/snapshot" data-public="true">目录快照</button>
        <button data-path="/v1/admin/publishers">发布者</button>
        <button data-path="/v1/admin/identities">身份</button>
        <button data-path="/v1/admin/api-tokens">API Token 列表</button>
        <button data-path="/v1/admin/audit">审计日志</button>
      </nav>

      <section class="card result-card">
        <div class="result-head">
          <h2 id="result-title">结果</h2>
          <button id="clear" class="secondary">清空</button>
        </div>
        <p id="message" role="status">选择一个查询。</p>
        <pre id="result" tabindex="0"></pre>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
