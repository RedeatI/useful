# Useful 动态软件源自托管：docker compose up -d 即可运行。
# 组件：source-server（API）+ source-worker（扫描）+ postgres + 共享对象存储卷。
# 首版不引入 Redis/Kafka/Elasticsearch；对象存储默认 filesystem（S3/minio 见 README）。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: useful_source
      POSTGRES_USER: useful
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-useful-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useful -d useful_source"]
      interval: 5s
      timeout: 3s
      retries: 20

  source-server:
    build:
      context: ../../services
    command: ["/app/source-server"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &srv-env
      ENVIRONMENT: ${ENVIRONMENT:-development}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://useful:${POSTGRES_PASSWORD:-useful-dev-password}@postgres:5432/useful_source?sslmode=disable
      SOURCE_ID: ${SOURCE_ID:-com.example.self-hosted}
      SOURCE_NAME: ${SOURCE_NAME:-Self-hosted Source}
      SOURCE_OPERATOR: ${SOURCE_OPERATOR:-Self-hosted}
      BASE_URL: ${BASE_URL:-http://127.0.0.1:8080}
      STORAGE_DRIVER: filesystem
      STORAGE_PATH: /data/storage
      TUF_KEYS_DIR: /data/tuf-keys
      BILLING_PROVIDER: ${BILLING_PROVIDER:-disabled}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET:-change-me-download-secret}
      OAUTH_SIGNING_SECRET: ${OAUTH_SIGNING_SECRET:-change-me-oauth-secret}
      AUTO_APPROVE: ${AUTO_APPROVE:-true}
    volumes:
      - sourcedata:/data
    ports:
      - "${HTTP_PORT:-8080}:8080"

  source-worker:
    build:
      context: ../../services
    command: ["/app/source-worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *srv-env
    volumes:
      - sourcedata:/data

  # E2E 测试运行器（仅 --profile e2e 时启动，不影响常规 up -d）。
  # 先运行 e2e/prepare.mjs 生成 e2e/out/ 夹具，再：
  #   docker compose --profile e2e up --build --abort-on-container-exit --exit-code-from e2e-runner
  e2e-runner:
    image: node:20-alpine
    profiles: ["e2e"]
    depends_on:
      - source-server
      - source-worker
    environment:
      BASE_URL: http://source-server:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
    volumes:
      - ./e2e:/e2e:ro
    command: ["node", "/e2e/e2e-phase9.mjs"]

volumes:
  pgdata:
  sourcedata:
