<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>示例 Web 工具</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f3f3f3;
        color: #1a1a1a;
      }
      body[data-theme="dark"] {
        background: #202020;
        color: #f5f5f5;
      }
      h1 {
        font-size: 20px;
      }
      button {
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid #1ca7c4;
        background: #1ca7c4;
        color: #fff;
        cursor: pointer;
        margin-right: 8px;
      }
      pre {
        background: rgba(127, 127, 127, 0.15);
        padding: 12px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>示例 Web 工具</h1>
    <p>本插件运行在 opaque-origin 沙箱 iframe 中，通过一次性 MessageChannel 与宿主通信，无法直接访问 Tauri API。</p>
    <div>
      <button id="theme">获取主题</button>
    </div>
    <pre id="out">准备就绪。</pre>
    <script type="module" src="main.js"></script>
  </body>
</html>
