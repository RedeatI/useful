<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Useful 中文权限决策流</title>
  <desc id="desc">GUI、CLI 与 MCP 调用进入统一契约后，依据能力类型分别本地执行、等待用户确认或失败关闭。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbfc"/>
      <stop offset="1" stop-color="#eef7f5"/>
    </linearGradient>
    <linearGradient id="contract" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#147f98"/>
      <stop offset="1" stop-color="#29c6bc"/>
    </linearGradient>
    <filter id="shadow" x="-14%" y="-18%" width="128%" height="145%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#173b45" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#719ea8"/>
    </marker>
  </defs>

  <rect width="1440" height="720" rx="28" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, sans-serif">
    <text x="64" y="72" font-size="30" font-weight="750" fill="#18343d">权限不是捷径，而是一道看得见的门</text>
    <text x="64" y="106" font-size="15" fill="#60767d">无论来自桌面、命令行还是 Agent，能力都先进入统一契约，再决定能否执行。</text>

    <g filter="url(#shadow)">
      <rect x="64" y="166" width="244" height="92" rx="17" fill="#ffffff" stroke="#d8e5e8"/>
      <rect x="82" y="184" width="48" height="48" rx="13" fill="#e2f7fa"/>
      <rect x="93" y="196" width="26" height="19" rx="3" fill="none" stroke="#168fa9" stroke-width="2.5"/>
      <text x="146" y="204" font-size="16" font-weight="700" fill="#1b363e">桌面 GUI</text>
      <text x="146" y="227" font-size="12" fill="#6c8086">可见反馈与用户操作</text>

      <rect x="64" y="280" width="244" height="92" rx="17" fill="#ffffff" stroke="#d8e5e8"/>
      <rect x="82" y="298" width="48" height="48" rx="13" fill="#e2f7fa"/>
      <text x="106" y="328" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#168fa9">&gt;_</text>
      <text x="146" y="318" font-size="16" font-weight="700" fill="#1b363e">JSON CLI</text>
      <text x="146" y="341" font-size="12" fill="#6c8086">确定性输入与退出码</text>

      <rect x="64" y="394" width="244" height="92" rx="17" fill="#ffffff" stroke="#d8e5e8"/>
      <rect x="82" y="412" width="48" height="48" rx="13" fill="#e2f7fa"/>
      <circle cx="98" cy="436" r="5" fill="#168fa9"/><circle cx="115" cy="426" r="5" fill="#168fa9"/><circle cx="115" cy="446" r="5" fill="#168fa9"/>
      <path d="m102 434 9-6m-9 10 9 6" stroke="#168fa9" stroke-width="2"/>
      <text x="146" y="432" font-size="16" font-weight="700" fill="#1b363e">本地 MCP</text>
      <text x="146" y="455" font-size="12" fill="#6c8086">Agent 受控调用入口</text>
    </g>

    <path d="M308 212H390M308 326H390M308 440H390" stroke="#719ea8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="408" y="186" width="312" height="276" rx="24" fill="#ffffff" stroke="#9fd5dc" stroke-width="2"/>
      <rect x="432" y="210" width="264" height="72" rx="15" fill="url(#contract)"/>
      <path d="m456 246 9 9 18-23" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="500" y="242" font-size="18" font-weight="700" fill="#ffffff">统一 Action 契约</text>
      <text x="500" y="263" font-size="11" fill="#d7ffff">descriptor · executor · receipt</text>
      <text x="432" y="320" font-size="13" font-weight="700" fill="#29434b">执行前必须回答四个问题</text>
      <g font-size="12" fill="#587077">
        <circle cx="442" cy="351" r="4" fill="#1ba3b9"/><text x="456" y="355">输入是否符合 closed-world Schema？</text>
        <circle cx="442" cy="382" r="4" fill="#1ba3b9"/><text x="456" y="386">来源、摘要与发布者身份是否匹配？</text>
        <circle cx="442" cy="413" r="4" fill="#1ba3b9"/><text x="456" y="417">权限是否在显式 allowlist 内？</text>
        <circle cx="442" cy="444" r="4" fill="#1ba3b9"/><text x="456" y="448">路径、归档与资源预算是否安全？</text>
      </g>
    </g>

    <path d="M720 246H790" stroke="#719ea8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M720 324H790" stroke="#719ea8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M720 402H790" stroke="#719ea8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="808" y="158" width="300" height="164" rx="20" fill="#ffffff" stroke="#bfe1c7"/>
      <rect x="832" y="182" width="52" height="52" rx="15" fill="#e9f8ed"/>
      <path d="m845 208 8 8 18-22" fill="none" stroke="#3b8b50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="900" y="201" font-size="12" font-weight="700" letter-spacing="1.2" fill="#3b8b50">路径 A</text>
      <text x="900" y="228" font-size="20" font-weight="700" fill="#1c383f">纯函数 / 本地只读</text>
      <text x="832" y="269" font-size="13" fill="#60767d">零权限能力可直接在本机执行</text>
      <rect x="832" y="286" width="126" height="22" rx="8" fill="#edf8f0"/>
      <text x="895" y="301" text-anchor="middle" font-size="10" fill="#397748">LOCAL · ALLOW</text>

      <rect x="808" y="342" width="300" height="180" rx="20" fill="#ffffff" stroke="#ecd9ac"/>
      <rect x="832" y="366" width="52" height="52" rx="15" fill="#fff3d9"/>
      <path d="M846 392v-6a12 12 0 0 1 24 0v6M843 392h30v22h-30z" fill="none" stroke="#a36b00" stroke-width="2.7"/>
      <text x="900" y="385" font-size="12" font-weight="700" letter-spacing="1.2" fill="#9a6808">路径 B</text>
      <text x="900" y="412" font-size="20" font-weight="700" fill="#1c383f">敏感能力</text>
      <text x="832" y="452" font-size="13" fill="#60767d">文件 · 网络 · 进程控制 · 安装</text>
      <rect x="832" y="472" width="246" height="34" rx="10" fill="#fff8e9" stroke="#efd9aa"/>
      <text x="955" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#80580b">展示影响 → 用户确认 → 执行</text>
    </g>

    <path d="M1108 240H1168" stroke="#719ea8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M1108 432H1168" stroke="#719ea8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="1184" y="174" width="192" height="116" rx="18" fill="#17343d"/>
      <text x="1210" y="209" font-size="12" font-weight="700" letter-spacing="1.2" fill="#8de5df">执行结果</text>
      <text x="1210" y="240" font-size="18" font-weight="700" fill="#ffffff">可见 · 可取消</text>
      <text x="1210" y="266" font-size="13" fill="#c4dadd">可复制 · 可审计</text>

      <rect x="1184" y="366" width="192" height="132" rx="18" fill="#17343d"/>
      <text x="1210" y="402" font-size="12" font-weight="700" letter-spacing="1.2" fill="#ffd68a">仍需确认</text>
      <text x="1210" y="434" font-size="18" font-weight="700" fill="#ffffff">不会静默执行</text>
      <text x="1210" y="461" font-size="12" fill="#c4dadd">Agent 调用不跳过用户</text>
      <text x="1210" y="481" font-size="12" fill="#c4dadd">确认与系统权限边界</text>
    </g>

    <path d="M564 462V568H808" fill="none" stroke="#d68a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="808" y="554" width="568" height="104" rx="20" fill="#fff4f4" stroke="#edc3c3"/>
    <circle cx="846" cy="606" r="20" fill="#d85f5f"/>
    <path d="M846 594v15m0 8v1" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="882" y="593" font-size="12" font-weight="700" letter-spacing="1.2" fill="#b64a4a">路径 C · FAIL CLOSED</text>
    <text x="882" y="623" font-size="18" font-weight="700" fill="#5f3030">证据缺失、身份漂移或结构异常：拒绝执行</text>
    <text x="882" y="646" font-size="12" fill="#8e5e5e">不猜测信任根，不降低校验标准，不把失败包装成成功。</text>
  </g>
</svg>
