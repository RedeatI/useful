      <rect x="18" y="180" width="68" height="30" rx="8" fill="#1ca7c4"/><text x="52" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Open</text>
    </g>

    <g transform="translate(1012 547)">
      <rect width="326" height="226" rx="14" fill="#ffffff" stroke="#1ca7c4" stroke-width="2"/>
      <rect x="18" y="18" width="44" height="44" rx="11" fill="#e4f8fb"/>
      <path d="M40 27v26M30 36h20M30 45h20" stroke="#1596b2" stroke-width="2" stroke-linecap="round"/>
      <text x="76" y="38" font-size="16" font-weight="700" fill="#1f2b2f">Media Runtimes</text>
      <text x="76" y="57" font-family="Consolas, monospace" font-size="10" fill="#849297">Preview / Transcode packs</text>
      <text x="18" y="91" font-size="12" fill="#637278">Split mpv and ffmpeg / ffprobe by purpose.</text>
      <rect x="18" y="111" width="72" height="24" rx="7" fill="#dff6fa"/><text x="54" y="127" text-anchor="middle" font-size="10" fill="#13879f">Your choice</text>
      <rect x="96" y="111" width="70" height="24" rx="7" fill="#fff7e8"/><text x="131" y="127" text-anchor="middle" font-size="10" fill="#8a5b08">Verify first</text>
      <text x="18" y="157" font-size="11" fill="#7e5c00">Fail closed until production signing is ready.</text>
      <rect x="18" y="180" width="116" height="30" rx="8" fill="#dff6fa" stroke="#1ca7c4"/><text x="76" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#13879f">Manage packs</text>
