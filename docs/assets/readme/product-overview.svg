      <text x="76" y="57" font-family="Consolas, monospace" font-size="10" fill="#849297">builtin.utilities.json</text>
      <text x="18" y="91" font-size="12" fill="#637278">Format, minify, validate. Input stays local.</text>
      <rect x="18" y="111" width="47" height="24" rx="7" fill="#f0f4f5"/><text x="41" y="127" text-anchor="middle" font-size="10" fill="#617176">Built-in</text>
      <rect x="71" y="111" width="43" height="24" rx="7" fill="#f0f4f5"/><text x="92" y="127" text-anchor="middle" font-size="10" fill="#617176">CLI</text>
      <rect x="120" y="111" width="57" height="24" rx="7" fill="#eaf8ed"/><text x="148" y="127" text-anchor="middle" font-size="10" fill="#397642">Read only</text>
      <rect x="18" y="158" width="68" height="30" rx="8" fill="#1ca7c4"/><text x="52" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Open</text>
      <rect x="94" y="158" width="68" height="30" rx="8" fill="#ffffff" stroke="#d8e0e3"/><text x="128" y="178" text-anchor="middle" font-size="12" fill="#59696f">Pin</text>
    </g>

