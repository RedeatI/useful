      <rect x="18" y="18" width="44" height="44" rx="11" fill="#e4f8fb"/>
      <path d="M30 39h20M33 33h14M35 45h10" stroke="#1596b2" stroke-width="2.5" stroke-linecap="round"/>
      <text x="76" y="38" font-size="16" font-weight="700" fill="#1f2b2f">Hash</text>
      <text x="76" y="57" font-family="Consolas, monospace" font-size="10" fill="#849297">builtin.utilities.hash</text>
