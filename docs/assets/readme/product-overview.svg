<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Useful desktop utility workspace overview</title>
  <desc id="desc">A Tool Library overview drawn from the current Useful interface, with navigation, filters, and six local capability cards.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset="0.52" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#ecfdf7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ca7c4"/>
      <stop offset="1" stop-color="#38e1d6"/>
    </linearGradient>
    <filter id="windowShadow" x="-10%" y="-14%" width="120%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1b3440" flood-opacity="0.17"/>
    </filter>
    <filter id="cardShadow" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#193c48" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#canvas)"/>
