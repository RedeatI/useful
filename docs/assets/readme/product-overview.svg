      <text x="76" y="57" font-family="Consolas, monospace" font-size="10" fill="#849297">builtin.process-monitor</text>
      <text x="18" y="91" font-size="12" fill="#637278">CPU, memory, disk, GPU, and network visibility.</text>
      <rect x="18" y="111" width="47" height="24" rx="7" fill="#f0f4f5"/><text x="41" y="127" text-anchor="middle" font-size="10" fill="#617176">Windows</text>
      <rect x="71" y="111" width="91" height="24" rx="7" fill="#fff7e8"/><text x="116" y="127" text-anchor="middle" font-size="10" fill="#8a5b08">Explicit access</text>
