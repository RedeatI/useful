      <rect x="18" y="111" width="47" height="24" rx="7" fill="#f0f4f5"/><text x="41" y="127" text-anchor="middle" font-size="10" fill="#617176">Built-in</text>
      <rect x="71" y="111" width="43" height="24" rx="7" fill="#f0f4f5"/><text x="92" y="127" text-anchor="middle" font-size="10" fill="#617176">MCP</text>
      <rect x="120" y="111" width="57" height="24" rx="7" fill="#eaf8ed"/><text x="148" y="127" text-anchor="middle" font-size="10" fill="#397642">No access</text>
      <rect x="18" y="158" width="68" height="30" rx="8" fill="#1ca7c4"/><text x="52" y="178" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Open</text>
      <rect x="94" y="158" width="68" height="30" rx="8" fill="#ffffff" stroke="#d8e0e3"/><text x="128" y="178" text-anchor="middle" font-size="12" fill="#59696f">Pin</text>
    </g>

    <g transform="translate(336 547)">
      <rect width="318" height="226" rx="14" fill="#ffffff" stroke="#e0e7e9"/>
      <rect x="18" y="18" width="44" height="44" rx="11" fill="#e4f8fb"/>
      <rect x="29" y="31" width="22" height="17" rx="3" fill="none" stroke="#1596b2" stroke-width="2"/>
      <path d="m37 35 8 5-8 5z" fill="#1596b2"/>
      <text x="76" y="38" font-size="16" font-weight="700" fill="#1f2b2f">Video Trim</text>
      <text x="76" y="57" font-family="Consolas, monospace" font-size="10" fill="#849297">builtin.video-trim</text>
      <text x="18" y="91" font-size="12" fill="#637278">Preview, lossless trim, transcode, extract audio.</text>
      <rect x="18" y="111" width="52" height="24" rx="7" fill="#f0f4f5"/><text x="44" y="127" text-anchor="middle" font-size="10" fill="#617176">Desktop</text>
      <rect x="76" y="111" width="74" height="24" rx="7" fill="#fff7e8"/><text x="113" y="127" text-anchor="middle" font-size="10" fill="#8a5b08">On demand</text>
