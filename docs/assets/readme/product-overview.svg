  </g>

  <rect x="60" y="119" width="234" height="726" fill="#ffffff"/>
  <line x1="294" y1="119" x2="294" y2="845" stroke="#dfe5e8"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, sans-serif">
