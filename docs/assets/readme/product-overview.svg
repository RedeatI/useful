      <text x="76" y="57" font-family="Consolas, monospace" font-size="10" fill="#849297">builtin.utilities.base64</text>
      <text x="18" y="91" font-size="12" fill="#637278">Local encoding across GUI, CLI, and MCP.</text>
      <rect x="18" y="111" width="47" height="24" rx="7" fill="#f0f4f5"/><text x="41" y="127" text-anchor="middle" font-size="10" fill="#617176">Built-in</text>
