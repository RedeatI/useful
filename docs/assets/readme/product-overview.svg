      <rect x="18" y="18" width="44" height="44" rx="11" fill="#e4f8fb"/>
      <path d="M30 30h20v20H30zM35 35h10M35 40h10M35 45h7" fill="none" stroke="#1596b2" stroke-width="2" stroke-linecap="round"/>
