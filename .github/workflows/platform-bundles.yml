name: Platform Bundles

on:
  workflow_dispatch:
    inputs:
      agent_kit_tag:
        description: Immutable published Agent Kit release tag
        required: true
        type: string
        default: v0.1.0-beta.10
      agent_kit_version:
        description: Agent Kit product version expected in MANIFEST.json
        required: true
        type: string
        default: 0.1.0-beta.10
      agent_kit_sha256:
        description: SHA-256 of the published Agent Kit ZIP
        required: true
        type: string
        default: 705b23242b666e5c99a943dcb561e262a1bfd469c16aa1cc5eb88fb18a01498b
      agent_kit_source_revision:
        description: Full source revision expected in MANIFEST.json
        required: true
        type: string
        default: 737d9bc86be3d97f9e5dc12511eaab48476a20e0

permissions:
  contents: read

concurrency:
  group: platform-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-kit-acceptance:
    name: agent-kit-${{ matrix.platform }}-node20
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
          - platform: macos-aarch64
            runner: macos-15
          - platform: linux-x86_64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked acceptance-driver dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download and execute the immutable published Agent Kit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_KIT_TAG: ${{ inputs.agent_kit_tag }}
          AGENT_KIT_VERSION: ${{ inputs.agent_kit_version }}
          AGENT_KIT_SHA256: ${{ inputs.agent_kit_sha256 }}
          AGENT_KIT_SOURCE_REVISION: ${{ inputs.agent_kit_source_revision }}
        run: |
          set -euo pipefail
          test "$AGENT_KIT_TAG" = "v$AGENT_KIT_VERSION"
          [[ "$AGENT_KIT_VERSION" =~ ^[0-9A-Za-z.-]+$ ]]
          [[ "$AGENT_KIT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$AGENT_KIT_SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          download_root="$RUNNER_TEMP/useful-agent-kit-download"
          extract_root="$RUNNER_TEMP/useful-agent-kit-extracted"
          receipt="$RUNNER_TEMP/agent-kit-acceptance-${{ matrix.platform }}.json"
          asset="Useful-$AGENT_KIT_VERSION-agent-kit.zip"
          mkdir "$download_root"
          gh release download "$AGENT_KIT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$download_root"
          test -f "$download_root/$asset"
          node scripts/accept-published-agent-kit.mjs \
            --archive "$download_root/$asset" \
            --extract-root "$extract_root" \
            --expected-sha256 "$AGENT_KIT_SHA256" \
            --expected-source-revision "$AGENT_KIT_SOURCE_REVISION" \
            --expected-version "$AGENT_KIT_VERSION" \
            --required-node-major 20 \
            --json | tee "$receipt"
      - name: Upload aggregate-only Agent Kit acceptance receipt
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: agent-kit-${{ matrix.platform }}-node20-acceptance
          path: ${{ runner.temp }}/agent-kit-acceptance-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundleArgs: nsis
            bundleGlob: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundleArgs: dmg
            bundleGlob: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos
            arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundleArgs: dmg
            bundleGlob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: linux
            arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundleArgs: appimage deb
            bundleGlob: |
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Verify exact clean source checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .
          key: ${{ matrix.target }}
      - name: Install Linux desktop bundling dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check product version contract
        run: node scripts/check-version-drift.mjs --json
      - name: Require a clean checkout and the committed matrix platform icon
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          case '${{ matrix.platform }}' in
            windows) icon='apps/useful/src-tauri/icons/icon.ico' ;;
            macos) icon='apps/useful/src-tauri/icons/icon.icns' ;;
            linux) icon='apps/useful/src-tauri/icons/icon.png' ;;
            *) echo 'Unknown preview platform.' >&2; exit 1 ;;
          esac
          test -f "$icon"
          test -s "$icon"
      - name: Build frontend required by Tauri context
        run: pnpm --filter @useful/app build
      - name: Compile native host for target
        run: cargo check -p useful-app --lib --target ${{ matrix.target }}
      - name: Build development-trust unsigned preview platform bundle
        env:
          USEFUL_ALLOW_DEVELOPMENT_UPDATE_TRUST: "1"
        run: pnpm --filter @useful/app tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundleArgs }}
      - name: Upload development-trust unsigned preview bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: useful-${{ matrix.platform }}-${{ matrix.arch }}-development-trust-unsigned-preview
          path: ${{ matrix.bundleGlob }}
          if-no-files-found: error
          retention-days: 14
